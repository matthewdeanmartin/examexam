name: Build and Test

on: [ push ]

permissions:
  contents: read

jobs:
  build-and-inspect-package:
    name: Build & inspect package.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: hynek/build-and-inspect-python-package@v3.0.1
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: extractions/setup-just@v4.0.0
        with:
          just-version: "1.58.0"
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'

      - name: Install uv and pipx
        run: |
          pip install uv && pip install pipx

      - name: Install global dependencies
        run: |
          pipx install uv && pipx install "coderoller" && \
          pipx install isort && pipx install black && pipx install bandit && \
          pipx install pylint && pipx install poetry && pipx install hatch

      - name: Install Dependencies
        run: uv sync --all-extras

      - name: Run just check
        run: chmod +x scripts/*.sh && uv run just check

